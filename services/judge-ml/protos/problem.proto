syntax = "proto3";

package problem.v1;

import "google/protobuf/struct.proto";

// Service definition for problem-service gRPC API.
// Used internally by judge-standard for high-speed test case retrieval.
service ProblemService {
  // Get single problem by ID
  rpc GetProblem(GetProblemRequest) returns (ProblemResponse) {}

  // Get test cases for a problem
  rpc GetTestCases(GetTestCasesRequest) returns (TestCasesResponse) {}

  // List all problems (paginated)
  rpc ListProblems(ListProblemsRequest) returns (ListProblemsResponse) {}

  // Health check for gRPC
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse) {}
}

// ============ Request Messages ============

message GetProblemRequest {
  int32 problem_id = 1;
}

message GetTestCasesRequest {
  int32 problem_id = 1;
}

message ListProblemsRequest {
  int32 skip = 1;           // Offset for pagination
  int32 limit = 2;          // Number of results (max 100)
  string problem_type = 3;  // Optional filter: "dsa", "ml", "cyber"
}

message HealthCheckRequest {}

// ============ Response Messages ============

message ProblemResponse {
  int32 id = 1;
  string title = 2;
  string description = 3;
  string problem_type = 4;             // "dsa", "ml", "cyber"
  int32 time_limit = 5;                // milliseconds
  int32 memory_limit = 6;              // MB
  string difficulty = 7;               // "easy", "medium", "hard"
  repeated string topics = 8;
  google.protobuf.Struct metadata = 9; // JSON metadata
  string created_at = 10;              // ISO 8601 timestamp
}

message TestCase {
  string input = 1;            // Test case input
  string expected_output = 2;  // Expected output
  int32 time_limit = 3;        // Override time limit (0 = use problem default)
  int32 hidden = 4;            // 1 = hidden, 0 = visible
}

message TestCasesResponse {
  int32 problem_id = 1;
  repeated TestCase test_cases = 2;
  int32 total_count = 3;    // Total test cases
  int32 visible_count = 4;  // Test cases visible to user
}

message ProblemSummary {
  int32 id = 1;
  string title = 2;
  string problem_type = 3;
  string difficulty = 4;
}

message ListProblemsResponse {
  repeated ProblemSummary problems = 1;
  int32 total = 2;
  int32 skip = 3;
  int32 limit = 4;
}

message HealthCheckResponse {
  string status = 1;    // "healthy", "degraded", "unhealthy"
  string service = 2;   // "problem-service"
  string database = 3;  // "connected", "disconnected"
}
