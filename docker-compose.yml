x-platform-env: &platform-env
  DATABASE_URL: postgresql+asyncpg://platform:platform@postgres:5432/platform
  REDIS_URL: redis://redis:6379/0
  SECRET_KEY: integrated-platform-secret
  AUTO_CREATE_SCHEMA: "false"
  SEED_DATA_ON_BOOT: "true"
  QUEUE_RETRY_LIMIT: "3"
  QUEUE_RETRY_BASE_DELAY_SECONDS: "2"
  QUEUE_RETRY_MAX_DELAY_SECONDS: "30"

services:
  postgres:
    image: postgres:16-alpine
    container_name: integrated-postgres
    environment:
      POSTGRES_DB: platform
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: integrated-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 5s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/integration.Dockerfile
    container_name: integrated-backend
    environment:
      <<: *platform-env
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    command:
      - /bin/sh
      - -c
      - alembic upgrade head && uvicorn orchestrator:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/ready"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    restart: unless-stopped

  judge-worker:
    build:
      context: .
      dockerfile: infrastructure/docker/integration.Dockerfile
    container_name: integrated-judge-worker
    environment:
      <<: *platform-env
    command: ["python", "worker_manager.py", "code", "--host", "0.0.0.0", "--port", "8101"]
    ports:
      - "8101:8101"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8101/ready"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 15s
    restart: unless-stopped

  ml-worker:
    build:
      context: .
      dockerfile: infrastructure/docker/integration.Dockerfile
    container_name: integrated-ml-worker
    environment:
      <<: *platform-env
    command: ["python", "worker_manager.py", "ml", "--host", "0.0.0.0", "--port", "8102"]
    ports:
      - "8102:8102"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8102/ready"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 15s
    restart: unless-stopped

  packet-worker:
    build:
      context: .
      dockerfile: infrastructure/docker/integration.Dockerfile
    container_name: integrated-packet-worker
    environment:
      <<: *platform-env
    command: ["python", "worker_manager.py", "packet", "--host", "0.0.0.0", "--port", "8103"]
    ports:
      - "8103:8103"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8103/ready"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
      args:
        VITE_FORCE_LIVE_CONTESTS: "true"
    container_name: integrated-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
