# ===================================================
# Universal Contest Platform - Docker Compose
# ===================================================
# Phase 1: PostgreSQL + NGINX + Problem Service
#
# CRITICAL: Append only — never remove services from
# previous phases. Future phases add new services below.
# ===================================================

services:

  # ---------------------------------------------------
  # Phase 1: PostgreSQL Database
  # ---------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: platform-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - platform-network

  # ---------------------------------------------------
  # Phase 1: Problem Service (FastAPI + asyncpg)
  # ---------------------------------------------------
  problem-service:
    build:
      context: ./services/problem-service
      dockerfile: Dockerfile
    container_name: platform-problem-service
    environment:
      DATABASE_URL: ${DATABASE_URL}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SERVICE_NAME: problem-service
      SERVICE_PORT: "8001"
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8001/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - platform-network
    restart: unless-stopped

  # ---------------------------------------------------
  # Phase 1: NGINX API Gateway (simple routing)
  # ---------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: platform-gateway
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - problem-service
    networks:
      - platform-network
    restart: unless-stopped

# ---------------------------------------------------
# Volumes
# ---------------------------------------------------
volumes:
  postgres_data:
    driver: local

# ---------------------------------------------------
# Networks
# ---------------------------------------------------
networks:
  platform-network:
    driver: bridge
