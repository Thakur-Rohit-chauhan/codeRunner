worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/json;
    resolver 127.0.0.11 valid=10s ipv6=off;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 10M;

    server {
        listen 80;
        server_name localhost;

        location = /api/auth {
            return 301 /api/auth/;
        }

        location /api/auth/ {
            rewrite ^/api/auth/?(.*)$ /auth/$1 break;
            proxy_pass http://auth-service:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/problem/ {
            set $problem_upstream http://problem-service:8001;
            rewrite ^/api/problem/?(.*)$ /$1 break;
            proxy_pass $problem_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/contest/ {
            set $contest_upstream http://contest-service:8003;
            rewrite ^/api/contest/?(.*)$ /$1 break;
            proxy_pass $contest_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/submission/ {
            set $submission_upstream http://submission-service:8002;
            rewrite ^/api/submission/?(.*)$ /$1 break;
            proxy_pass $submission_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health {
            set $problem_health_upstream http://problem-service:8001;
            proxy_pass $problem_health_upstream/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            return 404 '{"error":"Not Found","message":"Route not found"}';
        }
    }
}
