# NGINX Configuration for Universal Contest Platform
# Phase 1: Routes API traffic to problem-service
#
# Future phases will add upstream blocks for auth-service,
# contest-service, etc. without modifying existing routes.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # Request size limits
    client_max_body_size 10M;

    # Timeouts for long-running queries
    proxy_connect_timeout 60s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # ----- Upstream Definitions -----

    # Phase 1: Problem Service
    upstream problem_service {
        server problem-service:8001;
    }

    # Phase 2: Auth Service (uncomment when ready)
    # upstream auth_service {
    #     server auth-service:8002;
    # }

    # Phase 3: Contest Service (uncomment when ready)
    # upstream contest_service {
    #     server contest-service:8003;
    # }

    server {
        listen 80;
        server_name localhost;

        # ----- Problem Service Routes (Phase 1) -----

        location /api/problems {
            # CORS headers
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;

            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }

            proxy_pass http://problem_service;

            # Preserve original headers
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID      $request_id;
        }

        # ----- Health Check (Phase 1) -----

        location /health {
            proxy_pass http://problem_service;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ----- Phase 2: Auth Routes (uncomment when ready) -----
        # location /api/auth {
        #     proxy_pass http://auth_service;
        #     proxy_set_header Host              $host;
        #     proxy_set_header X-Real-IP         $remote_addr;
        #     proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        # }

        # ----- Default: 404 for undefined routes -----

        location / {
            return 404 '{"error": "Not Found", "message": "Route not found"}';
        }
    }
}
